services:
  # ============================================================
  # MongoDB — Primary application database
  # ============================================================
  mongodb:
    image: mongo:7.0
    container_name: acp-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: ai-content-platform
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data:/data/db
      - mongodb-config:/data/configdb
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ============================================================
  # Redis — Cache + BullMQ queue backbone
  # ============================================================
  redis:
    image: redis:7.4-alpine
    container_name: acp-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================
  # MinIO — S3-compatible object storage for local development
  # Large media files (videos, images, audio) are stored here.
  # MongoDB only stores metadata (per plan.md section 44).
  # ============================================================
  minio:
    image: minio/minio:latest
    container_name: acp-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 20s
      retries: 3

  # ============================================================
  # n8n — External workflow automation layer
  # Per plan.md section 25: external triggers, notifications,
  # and cross-platform integrations ONLY.
  # Core business logic remains in NestJS.
  # ============================================================
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: acp-n8n
    restart: unless-stopped
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5678/
      - GENERIC_TIMEZONE=UTC
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=admin
      - N8N_BASIC_AUTH_PASSWORD=changeme
    ports:
      - "5678:5678"
    volumes:
      - n8n-data:/home/node/.n8n
    depends_on:
      redis:
        condition: service_healthy

volumes:
  mongodb-data:
    driver: local
  mongodb-config:
    driver: local
  redis-data:
    driver: local
  minio-data:
    driver: local
  n8n-data:
    driver: local
